spring.datasource.url=jdbc:h2:mem:budgeting_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.ai.openai.api-key=test-key-not-a-real-credential
logging.level.org.springframework.ai=WARN

# TASK-010: the cleanup scheduler must never run on a real clock during tests -
# IdempotencyCleanupSchedulerTest / IdempotencyCleanupServiceTest call the
# service methods directly instead.
app.idempotency.cleanup-enabled=false
