# Perfil de teste: sobe o contexto sem depender de MySQL ou da OpenAI real.
# Herda o application.properties principal e sobrescreve apenas o necessário.

# Banco em memória (H2 em modo de compatibilidade MySQL).
spring.datasource.url=jdbc:h2:mem:budgeting;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Chave fictícia: os beans de IA são criados, mas nenhum teste os invoca de fato.
spring.ai.openai.api-key=test-key

logging.level.org.springframework.ai=WARN
