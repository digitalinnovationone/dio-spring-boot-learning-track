# Perfil "local": roda a aplicação SEM Docker/MySQL, usando H2 em memória.
# Uso: ./gradlew bootRun --args='--spring.profiles.active=local'
#
# Ótimo para avaliar os endpoints REST rapidamente. O fluxo de voz (/transactions/ai)
# ainda exige a variável OPENAI_API_KEY.

spring.datasource.url=jdbc:h2:mem:budgeting;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# Não tenta subir o MySQL do Docker Compose neste perfil.
spring.docker.compose.enabled=false
